name: Windows Phase 2 preview installer

on:
  push:
    branches: [build/windows-phase2-installer]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 77f05d8c6ea5ad2a271b48cc9514fa579eaf9fad
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build Windows x64 NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Prepare download and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview-download | Out-Null
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $destination = 'preview-download/DameBola-Phase2-Windows-x64-77f05d8-setup.exe'
          Copy-Item $installers[0].FullName $destination
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DameBola-Phase2-Windows-x64-77f05d8-setup.exe" | Set-Content 'preview-download/SHA256SUMS.txt' -Encoding ascii
          'Source commit: 77f05d8c6ea5ad2a271b48cc9514fa579eaf9fad' | Set-Content 'preview-download/SOURCE.txt' -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DameBola-Phase2-Windows-x64-77f05d8
          path: preview-download/*
          if-no-files-found: error
          retention-days: 14
