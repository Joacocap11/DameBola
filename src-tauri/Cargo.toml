[package]
name = "damebola"
version = "0.1.1"
license = "MIT"
repository = "https://github.com/joacocap11/DameBola"
description = "DameBola - alertas humorísticas entre compañeros de oficina"
edition = "2021"

[lib]
name = "damebola_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "damebola"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
base64 = "0.23.1"
fastrand = "2.5.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
mdns-sd = "0.21.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "vorbis"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tokio-util = "0.7.20"
uuid = { version = "1.20.0", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
